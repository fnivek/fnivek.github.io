<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#11111b">
<title>Aura Jump</title>
<meta name="description" content="Aura Jump, made by Bryce and Landon Holcomb, starring Aura the bearded dragon">
<!-- These make "Add to Home Screen" on an iPad or iPhone look like a real app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aura Jump">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- What a shared link shows in Messages, WhatsApp and the like -->
<meta property="og:title" content="Aura Jump">
<meta property="og:description" content="Made by Bryce and Landon Holcomb, starring Aura the bearded dragon. Tap to play!">
<meta property="og:image" content="https://fnivek.github.io/aura-jump/icon-512.png">
<meta property="og:url" content="https://fnivek.github.io/aura-jump/">
<meta property="og:type" content="website">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #11111b; color: #cdd6f4; overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  /* As big as fits, always 2 wide by 3 tall */
  canvas { display: block; aspect-ratio: 2 / 3; border-radius: 14px;
    width: min(calc(100vw - 16px), calc((100dvh - 120px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 2 / 3)); }
  .controls { display: flex; gap: 12px; align-items: center; justify-content: center;
    width: min(100%, 560px); padding: 10px 8px 12px; }
  button { font: inherit; border: 0; border-radius: 18px; touch-action: none; cursor: pointer; }
  #spit { flex: 1; height: 76px; font-size: 1.5rem; font-weight: 800; letter-spacing: 0.06em;
    background: #f0802f; color: #11111b; }
  #spit:active { transform: scale(0.97); background: #fab387; }
  #mute { width: 76px; height: 76px; font-size: 0.8rem; font-weight: 600;
    background: #313244; color: #cdd6f4; }
</style>
</head>
<body data-touch-area>
  <div class="stage"><canvas id="game" width="400" height="600"></canvas></div>
  <div class="controls">
    <button id="spit" type="button">SPIT</button>
    <button id="mute" type="button">Sound: on</button>
  </div>
<script src="game.js"></script>
</body>
</html>
